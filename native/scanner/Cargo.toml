[package]
name = "raggle-local-scanner"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
ignore = "0.4.32"
napi = { version = "3.12.0", features = ["napi8"] }
napi-derive = "3.6.2"

[build-dependencies]
napi-build = "2.2.3"

[profile.release]
lto = true
strip = "symbols"
